name: Supabase Keep-Alive

# Tujuan: ping Supabase REST & Auth API secara berkala agar project Free tier
# tidak di-pause otomatis setelah 7 hari tanpa aktivitas.
#
# Setup (di GitHub web):
# 1. Buka repo → Settings → Secrets and variables → Actions
# 2. Tambahkan Repository Secrets:
#    - SUPABASE_URL       (contoh: https://your-project.supabase.co)
#    - SUPABASE_ANON_KEY  (Anon / Publishable Key dari Supabase)
#    (Opsional jika ada project ke-2):
#    - SUPABASE_URL_2
#    - SUPABASE_ANON_KEY_2

on:
  schedule:
    # Dijalankan setiap hari jam 03:00 UTC (10:00 WIB) & 15:00 UTC (22:00 WIB)
    - cron: '0 3,15 * * *'

  # Bisa di-trigger manual kapan saja dari GitHub Web UI
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase Database & Auth
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping Supabase Project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_URL_2: ${{ secrets.SUPABASE_URL_2 }}
          SUPABASE_ANON_KEY_2: ${{ secrets.SUPABASE_ANON_KEY_2 }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ℹ️ SUPABASE_URL / SUPABASE_ANON_KEY belum diset di GitHub Secrets. Melewati ping."
            exit 0
          fi

          echo "=== Pinging Primary Supabase Project ==="
          rest_code=$(curl -sS -o /dev/null -w "%{http_code}" \
            -G \
            --data-urlencode "select=id" \
            --data-urlencode "limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/business_profiles")
          echo "REST Status: $rest_code"

          auth_code=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/auth/v1/health")
          echo "Auth Status: $auth_code"

          if [ "$rest_code" != "200" ] && [ "$auth_code" != "200" ]; then
            echo "❌ Keep-alive FAILED on Primary Project"
            exit 1
          fi
          echo "✅ Primary Project Keep-alive SUCCESS"

          if [ -n "$SUPABASE_URL_2" ] && [ -n "$SUPABASE_ANON_KEY_2" ]; then
            echo "=== Pinging Secondary Supabase Project ==="
            rest_code_2=$(curl -sS -o /dev/null -w "%{http_code}" \
              -G \
              --data-urlencode "select=id" \
              --data-urlencode "limit=1" \
              -H "apikey: ${SUPABASE_ANON_KEY_2}" \
              "${SUPABASE_URL_2}/rest/v1/business_profiles")
            echo "Secondary REST Status: $rest_code_2"

            auth_code_2=$(curl -sS -o /dev/null -w "%{http_code}" \
              -H "apikey: ${SUPABASE_ANON_KEY_2}" \
              "${SUPABASE_URL_2}/auth/v1/health")
            echo "Secondary Auth Status: $auth_code_2"

            if [ "$rest_code_2" != "200" ] && [ "$auth_code_2" != "200" ]; then
              echo "❌ Keep-alive FAILED on Secondary Project"
              exit 1
            fi
            echo "✅ Secondary Project Keep-alive SUCCESS"
          fi
